<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">

<body data-page="contact" data-root="">
<a class="skip" href="#contenu">Aller au contenu</a>
<header id="site-header"></header>
<main id="contenu">
<div class="page-title"><svg class="topo" data-seed="2"></svg><div class="wrap"><h1>Contact</h1><p>Un stage, une mission ou une question sur mes cartes ? Écris-moi.</p></div></div>
<section class="block" style="padding-top:56px">
  <div class="wrap two">
    <div class="reveal">
      <h2>Coordonnées</h2>
      <ul class="contact-list">
        <li><small>Email</small><a data-site-link="email"><span data-site-text="email"></span></a></li>
        <li><small>Localisation</small><span data-site-text="city"></span></li>
        <li><small>Disponibilité</small><span data-site-text="availability"></span></li>
        <li><small>LinkedIn</small><a data-site-link="linkedin" target="_blank" rel="noopener">Voir mon profil LinkedIn</a></li>
        <li><small>GitHub</small><a data-site-link="github" target="_blank" rel="noopener">Voir mon profil GitHub</a></li>
      </ul>
      <a class="btn" data-site-link="cv" download>Télécharger mon CV (PDF)</a>
    </div>
    <div class="reveal d1">
      <h2>Envoyer un message</h2>
      <form class="form" id="contact-form" novalidate onsubmit="return false">
        <div><label for="fullname">Nom</label><input id="fullname" name="fullname" autocomplete="name" required></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div><label for="subject">Objet</label><input id="subject" name="subject"></div>
        <div><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
        <button class="btn" type="submit">Envoyer le message</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </div>
  </div>
</section>

</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
